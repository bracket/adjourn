name: 'Copilot Setup Steps'

# Triggers for validation and automatic execution by Copilot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job name is mandatory for Copilot to pick it up
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout and install local packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SWI-Prolog from PPA
        run: |
          sudo apt-get update
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog

      - name: Verify SWI-Prolog version
        run: |
          swipl --version
          VERSION=$(swipl --version | grep -oP 'version \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          REQUIRED="9.1.12"
          if [ "$(printf '%s\n' "$REQUIRED" "$VERSION" | sort -V | head -n1)" != "$REQUIRED" ]; then
            echo "ERROR: SWI-Prolog version $VERSION is too old. Minimum required: $REQUIRED"
            exit 1
          fi
          echo "SWI-Prolog version $VERSION meets minimum requirement"

      - name: Install Python package in editable mode
        run: |
          # Use GITHUB_WORKSPACE to ensure correct directory context
          cd ${{ github.workspace }}
          pip install -e .