steps:
  - name: Install SWI-Prolog from PPA
    run: |
      sudo apt-get update
      sudo apt-add-repository -y ppa:swi-prolog/stable
      sudo apt-get update
      sudo apt-get install -y swi-prolog

  - name: Verify SWI-Prolog version
    run: |
      swipl --version
      VERSION=$(swipl --version | grep -oP 'version \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      REQUIRED="9.1.12"
      if [ "$(printf '%s\n' "$REQUIRED" "$VERSION" | sort -V | head -n1)" != "$REQUIRED" ]; then
        echo "ERROR: SWI-Prolog version $VERSION is too old. Minimum required: $REQUIRED"
        echo "Cannot proceed without compatible SWI-Prolog for janus-swi integration"
        exit 1
      fi
      echo "SWI-Prolog version $VERSION meets minimum requirement"

  - name: Install Python package in editable mode
    run: |
      cd /home/runner/work/constraint/constraint
      pip install -e .
    description: "Install constraint package with janus-swi dependency"
