name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up SWI-Prolog
        run: |
          # Ubuntu's default SWI-Prolog is 9.0.4, but janus-swi requires 9.1.12+
          # Try to install from PPA first, fall back to building from source if needed
          sudo apt-get update
          
          # Try adding PPA (may not work in all environments)
          sudo add-apt-repository -y ppa:swi-prolog/stable || true
          sudo apt-get update || true
          
          # Install SWI-Prolog
          sudo apt-get install -y swi-prolog
          
          # Check version
          swipl --version
          
          echo "Note: If SWI-Prolog version is < 9.1.12, janus-swi will not install"
          echo "In that case, you may need to build SWI-Prolog from source"
