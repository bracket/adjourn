[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint"
version = "0.0.0"
description = "A Python-based constraint checking system for validating code repositories against logical rules"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TODO: Your Name" }
]
dependencies = [
    "click>=8.1.0",
    "janus-swi>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
constraint = "constraint.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["constraint"]
branch = true
