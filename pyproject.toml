[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adjourn"
version = "0.1.8"
description = "A suspendable, resumable Prolog meta-interpreter for long-running queries that interleave machine and human/LLM resolution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Bracket" }
]
dependencies = [
    "click>=8.1.0",
    "janus-swi>=1.5.2",
    "lark>=1.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy==2.4.0",
    "ruff==0.16.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
    "adjourn[mcp,query]",
]

query = [
    "mnestic>=0.13.1",
]

mcp = [
    "fastmcp>=4.0.10",
    "haft-mcp-host @ git+https://github.com/bracket/haft@v0.2.0#subdirectory=packages/haft-mcp-host",
]

[project.scripts]
adjourn = "adjourn.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adjourn = ["*.pl"]
"adjourn.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["adjourn"]
branch = true

[tool.ruff.lint]
# TRY004 wants TypeError after failed isinstance checks. Our checks validate
# user-supplied data (YAML config, query terms); the CLI catches ValueError
# to report those cleanly, so ValueError is the correct type here.
ignore = ["TRY004"]

[tool.mypy]
# Exclude parser.py due to lark transformer internal typing issues
[[tool.mypy.overrides]]
module = "adjourn.parser.parser"
ignore_errors = true

# mnestic ships no type information.
[[tool.mypy.overrides]]
module = ["mnestic", "mnestic.*"]
ignore_missing_imports = true
