[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.1.8"
description = "A Python-based constraint checking system for validating code repositories against logical rules"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bracket" }
]
dependencies = [
    "click>=8.1.0",
    "janus-swi>=1.5.2",
    "lark>=1.1.0",
    "mnestic>=0.13.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
]

mcp = [
    "fastmcp>=3.4.7",
]

[project.scripts]
docket = "docket.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docket = ["*.pl"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["docket"]
branch = true

[tool.mypy]
# Exclude parser.py due to lark transformer internal typing issues
[[tool.mypy.overrides]]
module = "docket.parser.parser"
ignore_errors = true
