name: mini-swe-agent

# One-shot coding-agent run. mini-swe-agent edits + commits into a host repo
# checkout bind-mounted at /repo; the host owns clone/branch/push/PR. All LLM
# calls go to the local arbiter (Responses API) at a single alias. The task
# file is delivered via a read-only bind mount of a host dir at /work/task.
#
# Required env (fails to start if unset -- see ${VAR:?...} below):
#   MSWEA_REPO_ROOT    - host path to the ALREADY-cloned, ALREADY-branched repo
#   MSWEA_TASK_DIR     - host dir (mounted ro at /work/task) holding the task file
#   MSWEA_ISSUE_FILE   - container path to the task file (under /work/task)
#   HOST_UID / HOST_GID- ownership for commits + /repo files
#
# Optional env (sensible defaults):
#   MSWEA_IMAGE_VERSION - image tag (default below)
#   MSWEA_ARBITER_PORT  - host port arbiter listens on (default below)
#   MSWEA_MODEL_ALIAS   - arbiter model alias (default below)

networks:
  default:
    name: mini_swe_agent_default

services:
  mini:
    image: 'ghcr.io/bracket/service-mini-swe:${MSWEA_IMAGE_VERSION:-2.3.0}'
    pull_policy: missing
    restart: "no"
    working_dir: /work/repo
    environment:
      HOST_UID: '${HOST_UID:?Error: HOST_UID must be set (use: HOST_UID=$(id -u))}'
      HOST_GID: '${HOST_GID:?Error: HOST_GID must be set (use: HOST_GID=$(id -g))}'
      MSWEA_MODEL_NAME: 'openai/${MSWEA_MODEL_ALIAS:-mini-swe-coding}'
      MSWEA_MODEL_CLASS: 'litellm_response'
      OPENAI_API_BASE: 'http://${MSWEA_ARBITER_HOST:?Error: MSWEA_ARBITER_HOST must be set}:${MSWEA_ARBITER_PORT:-27248}/v1'
      OPENAI_API_KEY: 'arbiter-local-unused'
      MSWEA_COST_TRACKING: 'ignore_errors'
      PIP_INDEX_URL: 'http://${MSWEA_DEVPI_HOST}:${MSWEA_DEVPI_PORT:-7974}/bracket/packages/+simple/'
      PIP_TRUSTED_HOST: '${MSWEA_DEVPI_HOST:?Error: MSWEA_DEVPI_HOST must be set}'
    # host.docker.internal resolves to the host IP via host-gateway.
    # Requires Docker Engine >= 20.10 on Linux; macOS/Windows have it natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: '${MSWEA_REPO_ROOT:?Error: MSWEA_REPO_ROOT must be set}'
        target: /work/repo
      - type: bind
        source: '${MSWEA_TASK_DIR:?Error: MSWEA_TASK_DIR must be set}'
        target: /work/task
        read_only: true
    command:
      - /opt/venv/bin/mini
      - -y
      - --environment-class
      - local
      - -t
      - '${MSWEA_ISSUE_FILE:?Error: MSWEA_ISSUE_FILE must be set}'
